name: homelab-central
services:
  web:
    build: ./web
    container_name: homelab-central-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_APP_NAME: Homelab Central
      # API session cookies use secure:true; internal hop is HTTP — tell API the browser used HTTPS
      TRUST_FORWARDED_PROTO: https
    depends_on: [api]
    networks: [app, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.homelab-central.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.homelab-central.entrypoints=websecure
      - traefik.http.routers.homelab-central.tls=true
      - traefik.http.services.homelab-central.loadbalancer.server.port=3000
  api:
    build: ./api
    container_name: homelab-central-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_ORIGIN: ${APP_ORIGIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      PIN_PEPPER: ${PIN_PEPPER}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DOCKER_GATEWAY_URL: ${DOCKER_GATEWAY_URL}
      HOST_HELPER_URL: ${HOST_HELPER_URL}
      HOST_HELPER_TOKEN: ${HOST_HELPER_TOKEN}
      DOCKER_GATEWAY_TOKEN: ${DOCKER_GATEWAY_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      BACKUP_ROOT: ${BACKUP_ROOT}
      WUD_URL: ${WUD_URL:-}
      WUD_API_TOKEN: ${WUD_API_TOKEN:-}
      WUD_USER: ${WUD_USER:-}
      WUD_PASSWORD: ${WUD_PASSWORD:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    # host_access is non-internal so host.docker.internal can reach the native host helper on :4200
    networks: [app, ops, host_access]
    volumes:
      - /opt/homelab/data/homelab-central/backups:/backups
  worker:
    build: ./api
    container_name: homelab-central-worker
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on: [api, redis, postgres]
    networks: [app]
  postgres:
    image: postgres:17-alpine
    container_name: homelab-central-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: homelab_central
      POSTGRES_USER: homelab_central
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/homelab/data/homelab-central/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelab_central -d homelab_central"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]
  redis:
    image: redis:7-alpine
    container_name: homelab-central-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /opt/homelab/data/homelab-central/redis:/data
    networks: [app]
  docker-gateway:
    build: ./docker-gateway
    container_name: homelab-central-docker-gateway
    restart: unless-stopped
    environment:
      PORT: 4100
      GATEWAY_TOKEN: ${DOCKER_GATEWAY_TOKEN}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ops]
    read_only: true
    security_opt: [no-new-privileges:true]
networks:
  app: { internal: true }
  ops: { internal: true }
  host_access: {}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
